<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WenBin and Kelly Taiwan Trip 2027</title>
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taiwan 2027">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
html,body{margin:0;min-height:100%;background:#c8102e;color:#fff;font:17px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC",system-ui,sans-serif}
.l{min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
img{width:84px;height:84px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:block;margin:0 auto 14px}
</style>
</head>
<body>
<div class="l"><div><img src="apple-touch-icon.png" alt=""><div id="msg">Loading your trip… 載入中…</div></div></div>
<script>
/* Loader for the shared trip planner. This file holds the home-screen icon and the full-screen
   settings; the planner page and the plan itself come from the trip's Google script.
   The script's code travels in the link after "#", which is never sent to or stored on GitHub. */
(function () {
  var ok = function (c) { return /^AKfy[\w-]{20,200}$/.test(c); };
  var msg = document.getElementById('msg');
  var h = location.hash.slice(1).replace(/^setup-/, '');
  try { if (!ok(h)) h = localStorage.getItem('trip-code') || ''; } catch (e) {}
  if (!ok(h)) {
    msg.innerHTML = 'This link is missing the trip code. Ask WenBin for the full link.<br>這個連結缺少行程代碼，請跟 WenBin 要完整連結。';
    return;
  }
  try { localStorage.setItem('trip-code', h); } catch (e) {}
  if (location.hash !== '#' + h) history.replaceState(null, '', '#' + h);

  var url = 'https://script.google.com/macros/s/' + h + '/exec';
  var done = false;
  var show = function (html) {
    if (done) return; done = true;
    document.open(); document.write(html); document.close();
  };
  var cached = function () { try { return localStorage.getItem('trip-page'); } catch (e) { return null; } };

  // One try: resolves with the page, or rejects with a short reason we can show on screen.
  var once = function () {
    return new Promise(function (res, rej) {
      var t = setTimeout(function () { rej(new Error('timed out')); }, 15000);
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: 'page', args: [] })
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (txt) {
        var j;
        try { j = JSON.parse(txt); } catch (e) { throw new Error('not JSON: ' + txt.replace(/\s+/g, ' ').slice(0, 60)); }
        if (!j.ok) throw new Error('script: ' + (j.error || 'failed'));
        if (typeof j.result !== 'string') throw new Error('empty page');
        clearTimeout(t); res(j.result);
      }).catch(function (e) { clearTimeout(t); rej(e); });
    });
  };

  var fail = function (why) {
    var c = cached();
    if (c) { show(c); return; }
    msg.innerHTML = 'Could not reach the planner. 無法連線。' +
      '<br><button id="again" style="margin-top:14px;background:#fff;color:#c8102e;border:0;border-radius:99px;font:700 16px -apple-system,system-ui,sans-serif;padding:12px 24px;min-height:44px">Try again · 再試一次</button>' +
      '<div style="margin-top:14px;font-size:12px;opacity:.75">' + String(why).replace(/[<>&]/g, '') + '</div>';
    document.getElementById('again').onclick = function () { location.reload(); };
  };

  // Up to 3 tries (Google is sometimes slow or fails on the first request after a quiet spell).
  var attempt = function (n) {
    once().then(show, function (e) {
      var why = (e && e.message) || String(e);
      if (n < 3) {
        msg.innerHTML = 'Still loading… 載入中… (' + (n + 1) + '/3)';
        setTimeout(function () { attempt(n + 1); }, 1500 * n);
      } else fail(why);
    });
  };
  attempt(1);
})();
</script>
</body>
</html>
